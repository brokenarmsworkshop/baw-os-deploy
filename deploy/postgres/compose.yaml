name: baw-os-postgres

services:
  postgres:
    image: postgres:16-bookworm
    container_name: baw-postgres

    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      POSTGRES_USER: baw_admin
      POSTGRES_DB: baw_core
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      PGDATA: /var/lib/postgresql/data/pgdata

    secrets:
      - source: postgres_admin_password
        target: postgres_admin_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - baw_backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    security_opt:
      - no-new-privileges:true

secrets:
  postgres_admin_password:
    file: "${BAW_OS_ROOT}/secrets/postgres/postgres_admin_password.txt"

volumes:
  postgres_data:
    name: baw-postgres-data

networks:
  baw_backend:
    name: baw-backend